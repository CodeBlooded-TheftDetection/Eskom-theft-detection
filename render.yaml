services:
  - type: web
    name: eskom-theft-detection
    runtime: node
    plan: starter
    region: frankfurt
    
    buildCommand: npm install
    startCommand: npm start
    
    envVars:
      - key: PORT
        value: 3000
      - key: NODE_ENV
        value: production
      - key: SUPABASE_URL
        sync: false  # Must be set manually in dashboard
      - key: SUPABASE_KEY
        sync: false  # Must be set manually in dashboard
      - key: JWT_SECRET
        sync: false  # Must be set manually in dashboard
      - key: OPENAI_API_KEY
        sync: false  # Must be set manually in dashboard

    # Auto-deploy from GitHub
    repo: https://github.com/your-username/Eskom-theft-detection
    branch: main
    autoDeploy: true
    
    # Health check
    healthCheckPath: /
    healthCheckInterval: 300  # seconds
    healthCheckTimeout: 3     # seconds
