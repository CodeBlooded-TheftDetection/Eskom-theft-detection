<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Record Outcome</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../css/dashboard.css">
  <link rel="stylesheet" href="../css/record.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
<div class="layout">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="logo">
      <div class="logo-icon">⚡</div>
      <div>
        <h2>Eskom</h2>
        <p>Theft Detection</p>
      </div>
    </div>
    <nav class="menu">
      <p class="menu-title">SYSTEM SCREENS (11 TOTAL)</p>
      <a href="dashboard.html"><i data-lucide="layout-dashboard"></i> Main Dashboard</a>
      <a href="cases.html"><i data-lucide="file-text"></i> Case Detail</a>
      <a href="map.html"><i data-lucide="map"></i> Map View</a>
      <a href="report.html"><i data-lucide="bar-chart-3"></i> Report Screen</a>
      <a href="assign.html"><i data-lucide="user-check"></i> Assign Investigator</a>
      <a href="record.html" class="active"><i data-lucide="clipboard-list"></i> Record Outcome</a>
      <a href="caseList.html"><i data-lucide="list"></i> Case List</a>
      <a href="commander.html"><i data-lucide="bar-chart"></i> Commander Dashboard</a>
      <a href="resolved.html"><i data-lucide="check-circle"></i> Resolved Case</a>
      <a href="login.html"><i data-lucide="log-in"></i> Login Screen</a>
      <a href="upload.html"><i data-lucide="upload"></i> CSV Upload</a>
    </nav>
  </aside>

  <!-- MAIN -->
  <main class="main">
    <div class="topbar">
      <h1>Record Case Outcome</h1>
      <p>Submit resolution details</p>
    </div>

    <div class="card">
      <form id="recordForm">
        <label for="outcomeType">Outcome Type</label>
        <select id="outcomeType" required>
          <option value="">Select outcome</option>
          <option value="Resolved">Resolved</option>
          <option value="Unresolved">Unresolved</option>
          <option value="Escalated">Escalated</option>
        </select>

        <label for="caseNumber">Case Number</label>
        <input type="text" id="caseNumber" placeholder="Enter case number..." required>

        <label for="findings">Investigation Findings</label>
        <textarea id="findings" placeholder="Enter findings..." required></textarea>

        <label for="actions">Actions Taken</label>
        <textarea id="actions" placeholder="Enter actions..." required></textarea>

        <label for="evidence">Evidence Collected</label>
        <input type="text" id="evidence" placeholder="Photos, meter readings..." required>

        <label for="notes">Resolution Notes</label>
        <textarea id="notes" placeholder="Final remarks..."></textarea>

        <button type="submit" class="btn-primary">Save & Close Case</button>
      </form>
      <p id="formMessage"></p>
    </div>
  </main>
</div>

<script src="https://unpkg.com/lucide@latest"></script>
<script>
  lucide.createIcons();

  const form = document.getElementById('recordForm');
  const message = document.getElementById('formMessage');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const caseId = document.getElementById('caseNumber').value;
    const outcomeType = document.getElementById('outcomeType').value;
    const findings = document.getElementById('findings').value;
    const actions = document.getElementById('actions').value;
    const evidence = document.getElementById('evidence').value;
    const notes = document.getElementById('notes').value;

    try {
      const token = localStorage.getItem('authToken');
      const response = await fetch(`/api/cases/${caseId}/outcome`, {
        method: 'POST',
        headers: {
          'Authorization': `Bearer ${token}`,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({ outcomeType, findings, actions, evidence, notes })
      });

      const result = await response.json();
      if (response.ok) {
        message.textContent = "✅ Outcome recorded successfully.";
        message.className = "success";
      } else {
        message.textContent = `❌ Error: ${result.error || 'Failed to record outcome.'}`;
        message.className = "error";
      }
    } catch (err) {
      message.textContent = "❌ Error: Unable to connect to server.";
      message.className = "error";
    }
  });
</script>
</body>
</html>
