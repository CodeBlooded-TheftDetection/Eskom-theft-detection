<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Record Outcome</title>
  <link rel="stylesheet" href="../css/dashboard.css">
  <link rel ="stylesheet" href="../css/record.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>

<body>

<div class="layout">

  <!-- SIDEBAR -->
  <aside class="sidebar">
  <div class="logo">
    <div class="logo-icon">⚡</div>
    <div>
      <h2>Eskom</h2>
      <p>Theft Detection</p>
    </div>
  </div>

  <nav class="menu">
    <p class="menu-title">SYSTEM SCREENS (10 TOTAL)</p>
    <a href="dashboard.html"><i data-lucide="layout-dashboard"></i> Main Dashboard</a>
    <a href="cases.html"><i data-lucide="file-text"></i> Case Detail</a>
    <a href="map.html"><i data-lucide="map"></i> Map View</a>
    <a href="report.html"><i data-lucide="bar-chart-3"></i> Report Screen</a>
    <a href="assign.html"><i data-lucide="user-check"></i> Assign Investigator</a>
    <a href="record.html"><i data-lucide="clipboard-list"></i> Record Outcome</a>
    <a href="caseList.html"><i data-lucide="list"></i> Case List</a>
    <a href="commander.html"><i data-lucide="bar-chart"></i> Commander Dashboard</a>
    <a href="resolved.html"><i data-lucide="check-circle"></i> Resolved Case</a>
    <a href="login.html"><i data-lucide="log-in"></i> Login Screen</a>
  </nav>
</aside>
 

  <!-- MAIN CONTENT -->
  <div class="main">

    <div class="topbar">
  <h1>Record Case Outcome</h1>
  <p>Submit case resolution details</p>
</div>


    <div class="card">

      <label>Outcome Type</label>
      <select id="outcomeType">
        <option value="">Select outcome</option>
        <option>Resolved</option>
        <option>Unresolved</option>
        <option>Escalated</option>
      </select>

      <label>Case number/label>
      <textarea id="case-numb" placeholder="Enter case number..."></textarea>

      <label>Investigation Findings</label>
      <textarea id="findings" placeholder="Enter findings..."></textarea>

      <label>Actions Taken</label>
      <textarea id="actions" placeholder="Enter actions..."></textarea>

      <label>Evidence Collected</label>
      <input type="text" id="evidence" placeholder="Photos, meter readings..." required>

      <label>Resolution Notes</label>
      <textarea id="notes" placeholder="Final remarks..."></textarea>

      <br><br>

      <button onclick="saveOutcome()" class="btn-primary">Save & Close Case</button>
      <button onclick="loadOutcome()" class="btn-secondary">Load Saved</button>

    </div>

  </div>

</div>
<script src="https://unpkg.com/lucide@latest"></script>
<script>
  lucide.createIcons();
</script>


<script src="../js/record.js"></script>

</body>
</html>
