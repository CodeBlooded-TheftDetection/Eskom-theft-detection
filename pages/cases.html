<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cases — Eskom Theft Detection</title>
  <link rel="stylesheet" href="../css/dashboard.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    html, body, .layout, .main { min-height: 100%; }
    .main { display: flex; flex-direction: column; overflow: hidden; }
    .list-page { display: flex; flex-direction: column; gap: 20px; padding: 20px; flex: 1; overflow: hidden; }

    .topbar {
      background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
      color: white;
      padding: 24px 32px;
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.15);
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }
    .topbar h1 { margin-bottom: 6px; font-size: 26px; font-weight: 800; }
    .topbar p { margin: 0; font-size: 14px; opacity: 0.95; }

    .search-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }
    .search-input-wrap {
      flex: 1;
      min-width: 320px;
      position: relative;
    }
    .search-input {
      width: 100%;
      padding: 14px 16px 14px 44px;
      border-radius: 14px;
      border: 1.5px solid #e2e8f0;
      background: #ffffff;
      color: #0f172a;
      font-size: 14px;
      font-family: inherit;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .search-input:focus {
      outline: none;
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
    }
    .search-icon {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: #94a3b8;
      font-size: 16px;
      pointer-events: none;
    }

    .results-info {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: #475569;
      font-size: 13px;
      min-width: 180px;
      padding: 12px 16px;
      border-radius: 14px;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
    }

    .table-wrap {
      flex: 1;
      min-height: 0;
      overflow: auto;
      border-radius: 18px;
      border: 1.5px solid #e2e8f0;
      background: #ffffff;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.06);
    }
    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 900px;
    }
    thead {
      position: sticky;
      top: 0;
      z-index: 5;
    }
    thead th {
      background: #0f172a;
      color: #ffffff;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      text-align: left;
      padding: 16px 18px;
      border-bottom: 1px solid #1f2937;
      white-space: nowrap;
    }
    tbody tr {
      transition: background 0.2s ease, transform 0.2s ease;
    }
    tbody tr:nth-child(even) {
      background: #f8fafc;
    }
    tbody tr:hover {
      background: #e2e8f0;
      transform: translateY(-0.5px);
    }
    tbody td {
      padding: 16px 18px;
      font-size: 13px;
      color: #334155;
      vertical-align: middle;
    }
    .case-number-cell {
      font-family: 'DM Mono', monospace, sans-serif;
      font-weight: 700;
      color: #0f172a;
      white-space: nowrap;
    }
    .case-name-cell { max-width: 320px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .date-cell { white-space: nowrap; }
    .action-cell { display: flex; gap: 8px; flex-wrap: wrap; }
    .small-btn {
      padding: 8px 12px;
      border-radius: 10px;
      border: none;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .small-btn-blue { background: #2563eb; color: #ffffff; }
    .small-btn-outline { background: #ffffff; color: #0f172a; border: 1px solid #e2e8f0; }
    .small-btn:hover { transform: translateY(-1px); }

    .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
      padding: 6px 12px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }
    .badge.high { background: #fee2e2; color: #991b1b; }
    .badge.mid  { background: #fef3c7; color: #92400e; }
    .badge.low  { background: #dcfce7; color: #166534; }
    .badge.open { background: #dbeafe; color: #0c4a6e; }
    .badge.resolved { background: #dcfce7; color: #166534; }
    .badge.pending { background: #f8d7f2; color: #9d174d; }

    .state-row td { padding: 80px 20px; text-align: center; color: #64748b; }
    .state-card {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      color: inherit;
    }
    .state-card i { font-size: 36px; opacity: 0.45; }
    .state-card h3 { font-size: 18px; font-weight: 700; margin: 0; }
    .state-card p { margin: 0; font-size: 13px; }

    @media (max-width: 1024px) {
      .topbar { padding: 18px 22px; }
      .search-toolbar { flex-direction: column; align-items: stretch; }
      .results-info { width: 100%; justify-content: center; }
      table { min-width: 100%; }
      .action-cell { justify-content: flex-start; }
    }

    @media (max-width: 768px) {
      .list-page { padding: 16px; }
      .topbar h1 { font-size: 22px; }
      .search-input { padding: 14px 16px 14px 42px; }
      thead th, tbody td { padding: 14px 12px; }
      .search-input-wrap { min-width: 0; }
    }
  </style>
</head>
<body>
<div class="layout">

  <aside class="sidebar">
    <div class="logo">
      <div class="logo-icon">⚡</div>
      <div><h2>Eskom</h2><p>Theft Detection</p></div>
    </div>
    <nav class="menu" id="sidebarMenu"></nav>
  </aside>

  <main class="main">
    <header class="topbar">
      <div>
        <h1>Cases</h1>
        <p>Search by case name or case number for fast access across large datasets.</p>
      </div>
    </header>

    <div class="list-page">
      <div class="search-toolbar">
        <div class="search-input-wrap">
          <i class="fa-solid fa-magnifying-glass search-icon"></i>
          <input id="searchInput" class="search-input" type="search" placeholder="Search by case name or case number…" autocomplete="off" aria-label="Search cases" />
        </div>
        <div class="results-info" id="resultsInfo">Loading cases…</div>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Case Number</th>
              <th>Case Name</th>
              <th>Status</th>
              <th>Risk Level</th>
              <th>Date Created</th>
            </tr>
          </thead>
          <tbody id="casesTableBody">
            <tr class="state-row">
              <td colspan="5">
                <div class="state-card">
                  <i class="fa-solid fa-hourglass-start"></i>
                  <h3>Loading cases…</h3>
                  <p>Please wait while case data is fetched.</p>
                </div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>
</div>

<script src="../js/sidebar.js"></script>

  }

  async function loadCases() {
    const body = document.getElementById('casesTableBody');
    const info = document.getElementById('resultsInfo');

    body.innerHTML = `<tr class="state-row"><td colspan="6"><div class="state-card"><i class="fa-solid fa-hourglass-start"></i><h3>Loading cases…</h3><p>Please wait while case data is fetched.</p></div></td></tr>`;
    info.textContent = 'Loading cases…';

    try {
      const res = await fetch(`${BASE_URL}/api/cases`, { headers: authHeaders });
      if (res.status === 401 || res.status === 403) {
        localStorage.clear();
        window.location.href = 'login.html';
        return;
      }
      if (!res.ok) throw new Error(`HTTP ${res.status} ${res.statusText}`);

      const data = await res.json();
      allCases = Array.isArray(data) ? data : [];
      filteredCases = [...allCases];
      renderResults();
    } catch (err) {
      body.innerHTML = `<tr class="state-row"><td colspan="5"><div class="state-card"><i class="fa-solid fa-triangle-exclamation" style="color:#dc2626;"></i><h3>Failed to load cases</h3><p>${err.message || 'Unable to fetch case data.'}</p></div></td></tr>`;
      info.textContent = 'Error loading cases';
      console.error('Case search load error:', err);
    }
  }

  function normalizeSearchQuery(value) {
    return (value || '').trim().toLowerCase();
  }

  function filterCases(query) {
    if (!query) return [...allCases];
    return allCases.filter(c => {
      const caseNumber = (c.case_number || '').toLowerCase();
      const caseName = (c.suspect_name || '').toLowerCase();
      return caseNumber.includes(query) || caseName.includes(query);
    });
  }

  function renderResults() {
    const body = document.getElementById('casesTableBody');
    const info = document.getElementById('resultsInfo');
    const total = filteredCases.length;

    if (!total) {
      body.innerHTML = `<tr class="state-row"><td colspan="5"><div class="state-card"><i class="fa-solid fa-magnifying-glass"></i><h3>No results found</h3><p>Try another case name or case number.</p></div></td></tr>`;
      info.textContent = '0 cases found';
      return;
    }

    info.textContent = `${total} case${total !== 1 ? 's' : ''} found`;

    body.innerHTML = filteredCases.map(c => {
      const displayId = c.case_number || c.id || 'N/A';
      const caseName = c.suspect_name || 'Unknown case';
      const status = (c.outcome || 'OPEN').toUpperCase();
      const risk = (c.risk_level || 'LOW').toUpperCase();
      const created = c.created_at ? new Date(c.created_at).toLocaleDateString('en-ZA') : 'N/A';
      const viewTarget = `record.html?id=${encodeURIComponent(c.id)}`;
      const statClass = status === 'RESOLVED' ? 'resolved' : status === 'PENDING' ? 'pending' : 'open';
      const riskClass = risk === 'HIGH' ? 'high' : risk === 'MID' ? 'mid' : 'low';

      return `
        <tr>
          <td class="case-number-cell">${displayId}</td>
          <td class="case-name-cell">${caseName}</td>
          <td><span class="badge ${statClass}">${status}</span></td>
          <td><span class="badge ${riskClass}">${risk}</span></td>
          <td class="date-cell">${created}</td>
        </tr>`;
    }).join('');
  }

  function handleSearchInput() {
    const query = normalizeSearchQuery(document.getElementById('searchInput').value);
    if (searchTimer) clearTimeout(searchTimer);
    searchTimer = setTimeout(() => {
      filteredCases = filterCases(query);
      renderResults();
    }, 300);
  }

  document.addEventListener('DOMContentLoaded', () => {
    buildSidebar();
    document.getElementById('searchInput').addEventListener('input', handleSearchInput);
    loadCases();
  });
</script>
</body>
</html>
