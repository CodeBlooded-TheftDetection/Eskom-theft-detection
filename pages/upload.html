<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSV Upload</title>
  <link rel="stylesheet" href="../css/dashboard.css">
  <link rel="stylesheet" href="../css/upload.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
<div class="layout">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="logo">
      <div class="logo-icon">⚡</div>
      <div>
        <h2>Eskom</h2>
        <p>Theft Detection</p>
      </div>
    </div>
    <nav class="menu">
      <p class="menu-title">SYSTEM SCREENS (11 TOTAL)</p>
      <a href="dashboard.html"><i data-lucide="layout-dashboard"></i> Main Dashboard</a>
      <a href="cases.html"><i data-lucide="file-text"></i> Case Detail</a>
      <a href="map.html"><i data-lucide="map"></i> Map View</a>
      <a href="report.html"><i data-lucide="bar-chart-3"></i> Report Screen</a>
      <a href="assign.html"><i data-lucide="user-check"></i> Assign Investigator</a>
      <a href="record.html"><i data-lucide="clipboard-list"></i> Record Outcome</a>
      <a href="caseList.html"><i data-lucide="list"></i> Case List</a>
      <a href="commander.html"><i data-lucide="bar-chart"></i> Commander Dashboard</a>
      <a href="resolved.html"><i data-lucide="check-circle"></i> Resolved Case</a>
      <a href="login.html"><i data-lucide="log-in"></i> Login Screen</a>
      <a href="upload.html" class="active"><i data-lucide="upload"></i> CSV Upload</a>
    </nav>
  </aside>

  <!-- MAIN -->
  <main class="main">
    <div class="topbar">
      <h1>CSV Upload</h1>
      <p>Upload case data via CSV file</p>
    </div>

    <div class="card">
      <form id="uploadForm">
        <label for="csvFile">Select CSV File</label>
        <input type="file" id="csvFile" accept=".csv" required>

        <progress id="progressBar" value="0" max="100"></progress>

        <button type="submit" class="btn-primary">Upload</button>
      </form>

      <p id="message"></p>
    </div>
  </main>
</div>

<script src="https://unpkg.com/lucide@latest"></script>
<script>
  lucide.createIcons();

  const form = document.getElementById('uploadForm');
  const progressBar = document.getElementById('progressBar');
  const message = document.getElementById('message');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const fileInput = document.getElementById('csvFile');
    const csvFile = fileInput.files[0];

    if (!csvFile || !csvFile.name.endsWith('.csv')) {
      message.textContent = "❌ Error: Please upload a valid CSV file.";
      message.className = "error";
      return;
    }

    const formData = new FormData();
    formData.append('file', csvFile);

    try {
      progressBar.value = 50; // simulate halfway
      const token = localStorage.getItem('authToken'); // assuming token stored after login

      const response = await fetch('/api/upload', {
        method: 'POST',
        headers: { 'Authorization': `Bearer ${token}` },
        body: formData
      });

      const result = await response.json();
      if (response.ok) {
        progressBar.value = 100;
        message.textContent = `✅ Upload successful! ${result.recordsProcessed} records processed.`;
        message.className = "success";
      } else {
        message.textContent = `❌ Error: ${result.error || 'Upload failed.'}`;
        message.className = "error";
      }
    } catch (err) {
      message.textContent = "❌ Error: Unable to upload file.";
      message.className = "error";
    }
  });
</script>
</body>
</html>
